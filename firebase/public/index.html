<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orono Tech Department</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">

  <style>
    /* ========== GLOBAL STYLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Lexend', sans-serif;
      background: linear-gradient(135deg, #2d3f69 0%, #1d2a5d 100%);
      padding: 20px;
      padding-top: 70px;
      padding-bottom: 40px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      /* bias the vertically-centered content upward a bit */
      margin: 0 auto 12vh;
    }

    /* ========== HEADER ========== */
    .header {
      text-align: center;
      color: white;
      margin-bottom: 15px;
      padding: 20px;
    }

    .header h1 {
      font-size: 3em;
      font-weight: 500;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 1.2em;
      font-weight: 300;
      opacity: 0.95;
    }

    /* ========== CARD GRID ========== */
    /* auto-fit + 200px floor: cards share one row and shrink to fit as
       more are added (5 across at full width); wraps only when a card
       would drop below 200px wide. */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    /* ========== INDIVIDUAL CARD (style G: ghost minimal) ========== */
    .page-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .page-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
    }

    /* ========== GHOSTED WATERMARK ICON ========== */
    .card-ghost {
      position: absolute;
      right: -22px;
      bottom: -22px;
      opacity: 0.08;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .page-card:hover .card-ghost {
      opacity: 0.14;
      transform: rotate(-6deg);
    }

    .card-ghost .material-icons {
      font-size: 120px;
      color: #2d3f69;
    }

    .card-ghost img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 16px;
    }

    /* ========== SMALL DUOTONE ICON ========== */
    .card-badge .material-icons {
      font-size: 32px;
      color: #ad2122;
    }

    .card-badge img {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* ========== CARD CONTENT ========== */
    .card-title {
      font-size: 1.15em;
      font-weight: 700;
      color: #1d2a5d;
      margin: 0;
      line-height: 1.3;
      position: relative;
      border-bottom: 2px solid transparent;
      align-self: flex-start;
      transition: border-color 0.2s ease;
    }

    .page-card:hover .card-title {
      border-color: #ad2122;
    }

    .card-description {
      font-size: 0.85em;
      color: #666666;
      line-height: 1.5;
      margin: 0;
      flex-grow: 1;
      position: relative;
    }

    /* ========== RESPONSIVE DESIGN ========== */
    @media (max-width: 768px) {
      .card-grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 2.2em;
      }

      .header p {
        font-size: 1em;
      }
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      background: white;
      border-radius: 12px;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .empty-state .material-icons {
      font-size: 80px;
      color: #bdc3c7;
      margin-bottom: 20px;
    }

    .empty-state h2 {
      color: #1d2a5d;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .empty-state p {
      color: #666666;
    }

    /* ========== CARD EDIT BUTTON ========== */
    .card-edit-btn {
      position: absolute;
      top: 12px;
      right: 10px;
      background: rgba(45, 63, 105, 0.08);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #2d3f69;
      opacity: 0;
      transition: all 0.2s ease;
      z-index: 2;
    }

    .page-card:hover .card-edit-btn { opacity: 1; }

    .card-edit-btn:hover { background: rgba(45, 63, 105, 0.2); }

    .card-edit-btn .material-icons { font-size: 18px; }

    .btn-delete {
      background: none;
      border: 2px solid #ad2122;
      color: #ad2122;
      border-radius: 6px;
      padding: 12px 20px;
      font-family: 'Lexend', sans-serif;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-delete:hover { background: #fbeaea; }

    /* ========== ADD CARD (slim bar below the grid) ========== */
    .add-card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      margin-bottom: 30px;
    }

    .add-card:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.7);
      color: white;
    }

    .add-card .material-icons {
      font-size: 26px;
    }

    /* ========== MODAL ========== */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      margin: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e0e0e0;
    }

    .modal-header h2 {
      color: #2d3f69;
      font-size: 1.5em;
      margin: 0;
    }

    .close-modal {
      font-size: 28px;
      font-weight: bold;
      color: #999;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
    }

    .close-modal:hover {
      color: #333;
    }

    .form-group { margin-bottom: 16px; text-align: left; }

    .form-group label {
      display: block;
      color: #2d3f69;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.92em;
    }

    .form-group input {
      width: 100%;
      padding: 11px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-family: 'Lexend', sans-serif;
      font-size: 0.92em;
    }

    .form-group input:focus { outline: none; border-color: #2d3f69; }

    .form-group small { display: block; color: #666; font-size: 0.82em; margin-top: 4px; }

    .button-group { display: flex; gap: 10px; margin-top: 22px; }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-family: 'Lexend', sans-serif;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2d3f69 0%, #1d2a5d 100%);
      color: white;
    }

    .btn-secondary {
      background-color: #f5f5f5;
      color: #2d3f69;
      border: 2px solid #e0e0e0;
    }

    .form-message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 0.9em;
      display: none;
    }

    .form-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .form-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .form-message.show {
      display: block;
    }

    /* ========== LOADING INDICATOR ========== */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2d3f69 0%, #1d2a5d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid #ad2122;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: white;
      margin-top: 20px;
      font-size: 1.1em;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <div class="container">
    <div class="header">
      <h1>Orono Tech Department</h1>
      <p>Welcome! Select a resource below to get started</p>
    </div>

    <div id="content"></div>
  </div>

  <!-- Add Page Card Modal -->
  <div class="modal" id="addCardModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="cardModalTitle">Add Page Card</h2>
        <span class="close-modal" id="closeCardModal">&times;</span>
      </div>
      <form id="addCardForm">
        <div class="form-group">
          <label for="cardName">Name *</label>
          <input type="text" id="cardName" required placeholder="Tech Links">
        </div>
        <div class="form-group">
          <label for="cardUrl">URL *</label>
          <input type="text" id="cardUrl" required placeholder="links.html">
          <small>A site page (links.html, documentation.html, status.html...) or any full https:// URL</small>
        </div>
        <div class="form-group">
          <label for="cardDescription">Description</label>
          <input type="text" id="cardDescription" placeholder="Quick access to department tools">
        </div>
        <div class="form-group">
          <label for="cardIcon">Material icon</label>
          <input type="text" id="cardIcon" placeholder="link">
          <small>Icon name from fonts.google.com/icons (default: folder)</small>
        </div>
        <div class="form-group">
          <label for="cardImage">Image URL (optional, overrides icon)</label>
          <input type="text" id="cardImage" placeholder="https://lh3.googleusercontent.com/d/...">
        </div>
        <div class="button-group">
          <button type="button" class="btn-delete" id="deleteCardBtn" style="display:none;">Delete</button>
          <button type="button" class="btn-secondary" id="cancelCardBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="cardSubmitBtn">Add Card</button>
        </div>
        <div class="form-message" id="cardMsg"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { renderLayout } from './js/layout.js';
    import { authReady, gateEditing } from './js/auth.js';
    import { getHomePages, addItem, updateItem, deleteItem } from './js/data.js';
    import { attachIconPicker } from './js/icon-picker.js';

    attachIconPicker(document.getElementById('cardIcon'));
    gateEditing('homePages');

    renderLayout('home');

    // Old sheet rows stored relative Apps Script URLs like "?page=links".
    function resolvePageUrl(url) {
      if (!url) return '#';
      if (url.indexOf('http') === 0) return url;
      const match = url.match(/[?&]page=([\w-]+)/);
      if (match) {
        return match[1] === 'home' ? 'index.html' : match[1] + '.html';
      }
      return url;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    const addCardTile = `
      <div class="add-card" id="addCardTile">
        <span class="material-icons">add_circle_outline</span>
        <span>Add Page Card</span>
      </div>`;

    function render(pages) {
      const content = document.getElementById('content');
      if (!pages.length) {
        content.innerHTML = addCardTile;
        wireAddTile();
        return;
      }

      content.innerHTML = '<div class="card-grid">' + pages.map(page => {
        const iconClass = escapeHtml(page.iconClass || 'folder');
        const badge = page.imageUrl
          ? `<img src="${escapeHtml(page.imageUrl)}" alt=""
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
             <span class="material-icons" style="display:none;">${iconClass}</span>`
          : `<span class="material-icons">${iconClass}</span>`;
        return `
          <a href="${escapeHtml(resolvePageUrl(page.url))}" class="page-card">
            <button class="card-edit-btn" data-edit="${escapeHtml(page.id)}" title="Edit card" type="button">
              <span class="material-icons">edit</span>
            </button>
            <div class="card-ghost"><span class="material-icons">${iconClass}</span></div>
            <div class="card-badge">${badge}</div>
            <h3 class="card-title">${escapeHtml(page.name)}</h3>
            <p class="card-description">${escapeHtml(page.description)}</p>
          </a>`;
      }).join('') + '</div>' + addCardTile;
      wireAddTile();

      content.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const page = currentPages.find(p => p.id === btn.dataset.edit);
          if (page) openModal(page);
        });
      });
    }

    // ---------- Add / Edit Page Card modal ----------

    const modal = document.getElementById('addCardModal');
    const cardMsg = document.getElementById('cardMsg');
    let currentPages = [];
    let editingId = null;

    function openModal(page) {
      editingId = page ? page.id : null;
      document.getElementById('cardModalTitle').textContent = page ? 'Edit Page Card' : 'Add Page Card';
      document.getElementById('cardSubmitBtn').textContent = page ? 'Save Changes' : 'Add Card';
      document.getElementById('deleteCardBtn').style.display = page ? 'block' : 'none';
      document.getElementById('cardName').value = page ? (page.name || '') : '';
      document.getElementById('cardUrl').value = page ? (page.url || '') : '';
      document.getElementById('cardDescription').value = page ? (page.description || '') : '';
      document.getElementById('cardIcon').value = page ? (page.iconClass || '') : '';
      document.getElementById('cardImage').value = page ? (page.imageUrl || '') : '';
      cardMsg.textContent = '';
      cardMsg.className = 'form-message';
      modal.classList.add('show');
    }

    function wireAddTile() {
      document.getElementById('addCardTile').addEventListener('click', () => openModal(null));
    }

    function closeModal() {
      modal.classList.remove('show');
      document.getElementById('addCardForm').reset();
      editingId = null;
    }

    document.getElementById('cancelCardBtn').addEventListener('click', closeModal);
    document.getElementById('closeCardModal').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    async function reload() {
      currentPages = await getHomePages();
      render(currentPages);
    }

    document.getElementById('deleteCardBtn').addEventListener('click', async () => {
      const name = document.getElementById('cardName').value || 'this card';
      if (!editingId || !confirm(`Delete "${name}" from the home page?`)) return;
      try {
        await deleteItem('homePages', editingId);
        closeModal();
        await reload();
      } catch (err) {
        cardMsg.textContent = 'Delete failed: ' + err.message;
        cardMsg.className = 'form-message error show';
      }
    });

    document.getElementById('addCardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      cardMsg.textContent = 'Saving...';
      cardMsg.className = 'form-message show';
      const data = {
        name: document.getElementById('cardName').value.trim(),
        url: document.getElementById('cardUrl').value.trim(),
        description: document.getElementById('cardDescription').value.trim(),
        iconClass: document.getElementById('cardIcon').value.trim() || 'folder',
        imageUrl: document.getElementById('cardImage').value.trim()
      };
      try {
        if (editingId) {
          await updateItem('homePages', editingId, data);
        } else {
          await addItem('homePages', data);
        }
        closeModal();
        await reload();
      } catch (err) {
        cardMsg.textContent = 'Save failed: ' + err.message;
        cardMsg.className = 'form-message error show';
      }
    });

    async function init() {
      await authReady;
      try {
        await reload();
      } catch (err) {
        console.error('Failed to load home pages:', err);
        render([]);
      }
      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('hidden');
      setTimeout(() => { overlay.style.display = 'none'; }, 300);
    }

    init();
  </script>
</body>
</html>
