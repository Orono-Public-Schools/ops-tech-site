<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lexend', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-height: 560px;
      overflow-y: auto;
    }

    h2 {
      color: #2d3f69;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #2d3f69;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 4px;
      font-family: 'Lexend', sans-serif;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #2d3f69;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      font-family: 'Lexend', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2d3f69 0%, #1d2a5d 100%);
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1d2a5d 0%, #2d3f69 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(45, 63, 105, 0.3);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background-color: #f5f5f5;
      color: #2d3f69;
      border: 2px solid #e0e0e0;
    }

    .btn-secondary:hover {
      background-color: #e0e0e0;
    }

    .message {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #2d3f69;
      margin-top: 10px;
    }

    .loading.show {
      display: block;
    }

    .icon-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background-color: #f8f9fa;
      border-radius: 4px;
      margin-top: 8px;
    }

    .icon-preview.show {
      display: flex;
    }

    .icon-preview .material-icons {
      font-size: 32px;
      color: #2d3f69;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h2>Add New Page to Home</h2>

    <div id="message" class="message"></div>

    <form id="pageForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="pageName">Page Name *</label>
        <input
          type="text"
          id="pageName"
          name="pageName"
          placeholder="e.g., Tech Department Links, Documentation"
          required
        >
      </div>

      <div class="form-group">
        <label for="pageUrl">Page URL *</label>
        <input
          type="text"
          id="pageUrl"
          name="pageUrl"
          placeholder="?page=links or full URL"
          required
        >
        <div class="help-text">
          Use ?page=links or ?page=documentation for internal pages<br>
          Or full URL like: https://script.google.com/.../exec?page=links
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <input
          type="text"
          id="description"
          name="description"
          placeholder="Brief description of this page"
          required
        >
      </div>

      <div class="form-group">
        <label for="iconClass">Material Icon *</label>
        <select id="iconClass" name="iconClass" required onchange="updateIconPreview()">
          <option value="">-- Select an icon --</option>
        </select>
        <div id="iconPreview" class="icon-preview">
          <span class="material-icons" id="iconDisplay"></span>
          <span id="iconName"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="imageUrl">Custom Image URL (Optional)</label>
        <input
          type="text"
          id="imageUrl"
          name="imageUrl"
          placeholder="https://lh3.googleusercontent.com/d/FILE_ID"
        >
        <div class="help-text">Leave blank to use Material Icon. Use "View All Images" to copy image URLs.</div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
        <button type="submit" class="btn-primary" id="submitBtn">Add Page</button>
      </div>
    </form>

    <div id="loading" class="loading">
      Adding page to Home sheet...
    </div>
  </div>

  <script>
    // Load icon classes on page load
    document.addEventListener('DOMContentLoaded', function() {
      google.script.run
        .withSuccessHandler(populateIcons)
        .withFailureHandler(function(error) {
          showMessage('error', 'Error loading icons: ' + error.message);
        })
        .getIconClasses();
    });

    function populateIcons(icons) {
      const select = document.getElementById('iconClass');
      icons.forEach(function(icon) {
        const option = document.createElement('option');
        option.value = icon;
        option.textContent = icon;
        select.appendChild(option);
      });
    }

    function updateIconPreview() {
      const iconClass = document.getElementById('iconClass').value;
      const iconPreview = document.getElementById('iconPreview');
      const iconDisplay = document.getElementById('iconDisplay');
      const iconName = document.getElementById('iconName');

      if (iconClass) {
        iconDisplay.textContent = iconClass;
        iconName.textContent = iconClass;
        iconPreview.classList.add('show');
      } else {
        iconPreview.classList.remove('show');
      }
    }

    function handleSubmit(event) {
      event.preventDefault();

      const pageData = {
        pageName: document.getElementById('pageName').value.trim(),
        pageUrl: document.getElementById('pageUrl').value.trim(),
        description: document.getElementById('description').value.trim(),
        iconClass: document.getElementById('iconClass').value,
        imageUrl: document.getElementById('imageUrl').value.trim()
      };

      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const messageDiv = document.getElementById('message');

      submitBtn.disabled = true;
      loading.classList.add('show');
      messageDiv.classList.remove('show');

      google.script.run
        .withSuccessHandler(function(result) {
          submitBtn.disabled = false;
          loading.classList.remove('show');

          if (result.success) {
            showMessage('success', result.message);
            setTimeout(function() {
              document.getElementById('pageForm').reset();
              updateIconPreview();
            }, 1500);
            setTimeout(function() {
              google.script.host.close();
            }, 2500);
          } else {
            showMessage('error', result.message);
          }
        })
        .withFailureHandler(function(error) {
          submitBtn.disabled = false;
          loading.classList.remove('show');
          showMessage('error', 'Error: ' + error.message);
        })
        .addPageToSheet(pageData);
    }

    function showMessage(type, message) {
      const messageDiv = document.getElementById('message');
      messageDiv.className = 'message ' + type + ' show';
      messageDiv.textContent = message;
    }
  </script>
</body>
</html>
