    * {

    body {

      padding: 20px;

    }

    /* ========== CONTAINER ========== */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ========== PAGE HEADER ========== */
    .page-header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
      padding: 40px 20px 20px 20px;
    }

    .page-header h1 {
      font-size: 2.5em;
      font-weight: 500;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .page-header p {
      font-size: 1.1em;
      font-weight: 300;
      opacity: 0.95;
    }

    /* ========== BACK TO HOME BUTTON ========== */
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95em;
      border: 2px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    .back-home:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateX(-3px);
    }

    .back-home .material-icons {
      font-size: 18px;
    }

    /* ========== CATEGORY SECTIONS ========== */
    .category-section {
      margin-bottom: 50px;
    }

    .category-title {
      font-size: 1.8em;
      font-weight: 700;
      color: white;
      margin-bottom: 25px;
      padding-left: 15px;
      border-left: 5px solid #ad2122;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    /* ========== ADD IMAGE BUTTON ========== */
    .add-image-section {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 40px;
    }

    .add-image-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #ad2122 0%, #7a1718 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Lexend', sans-serif;
      font-size: 0.95em;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(173, 33, 34, 0.3);
    }

    .add-image-btn:hover {
      background: linear-gradient(135deg, #7a1718 0%, #ad2122 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(173, 33, 34, 0.4);
    }

    /* ========== IMAGE GRID ========== */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }

    .image-card {
      background: white;
      border-radius: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: all 0.3s;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      cursor: grab;
      border: 2px solid transparent;
      background-image: linear-gradient(white, white), linear-gradient(135deg, #2d3f69 0%, #ad2122 100%);
      background-origin: padding-box, border-box;
      background-clip: padding-box, border-box;
    }

    .image-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .image-card.dragging {
      opacity: 0.5;
      cursor: grabbing;
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .image-card.drag-over {
      border: 3px dashed #ad2122;
      background: #fff5f5;
    }

    .drag-handle {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: all 0.3s;
    }

    .drag-handle:hover {
      background: white;
      transform: scale(1.1);
    }

    .drag-handle .material-icons {
      font-size: 18px;
      color: #2d3f69;
    }

    .image-preview {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: linear-gradient(135deg, #2d3f69 0%, #1d2a5d 100%);
      display: block;
      padding: 10px;
    }

    .image-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .image-description {
      font-size: 1em;
      font-weight: 600;
      color: #1d2a5d;
      margin-bottom: 8px;
      line-height: 1.4;
    }


    .image-url {
      font-size: 0.75em;
      color: #999;
      word-break: break-all;
      margin-top: auto;
      margin-bottom: 12px;
      font-family: monospace;
    }

    .button-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .copy-btn, .open-btn {
      padding: 10px 16px;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Lexend', sans-serif;
      font-size: 0.85em;
      font-weight: 500;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .copy-btn {
      background: #2d3f69;
    }

    .copy-btn:hover {
      background: #1d2a5d;
    }

    .copy-btn.copied {
      background: #4caf50;
    }

    .open-btn {
      background: #ad2122;
    }

    .open-btn:hover {
      background: #7a1718;
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      background: white;
      padding: 60px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);

    .empty-state .material-icons {
      font-size: 80px;

    .empty-state h2 {

    .empty-state p {
      font-size: 1.1em;
      color: #666;
      margin-bottom: 20px;
    }

    /* ========== LOADING OVERLAY ========== */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(45, 63, 105, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top: 5px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: white;
      margin-top: 20px;
      font-size: 1.1em;
      font-weight: 500;
    }

    /* ========== SKELETON LOADERS ========== */
    .skeleton-section {
      margin-bottom: 50px;
    }

    .skeleton-section-title {
      height: 32px;

      animation: shimmer 1.5s infinite;
      border-radius: 6px;
      margin-bottom: 25px;
      padding-left: 15px;

    .skeleton-grid {

      gap: 25px;
      margin-bottom: 30px;

    .skeleton-card {
      background: white;
      border-radius: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .skeleton-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-info {
      padding: 20px;
    }

    .skeleton-desc {
      height: 18px;
      width: 80%;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .skeleton-url {
      height: 14px;
      width: 100%;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      margin-bottom: 12px;

    .skeleton-buttons {
      display: flex;
      gap: 8px;
    }

    .skeleton-button {

      height: 40px;

      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .skeleton-container {
      transition: opacity 0.3s ease;
    }

    .skeleton-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ========== MODAL STYLES ========== */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);

    .modal.show {

    .modal-content {

    // Image data from server
    var allImages = [

          var img = images[i];
      ?>
      {
        description: "<?= img.description.replace(/"/g, '\\"').replace(/\n/g, '\\n') ?>",
        url: "<?= img.url.replace(/"/g, '\\"') ?>",
        category: "<?= img.category.replace(/"/g, '\\"') ?>"
      }<? if (i < images.length - 1) { ?>,<? } ?>
      <?
        }
      ?>

    var categories = [];

    // Extract unique categories and organize images
    function extractCategories() {
      var categoryMap = {};

      allImages.forEach(function(img) {
        var cat = img.category || 'Uncategorized';
        if (!categoryMap[cat]) {
          categoryMap[cat] = [];
        }
        categoryMap[cat].push(img);
      });

      // Sort categories alphabetically
      categories = Object.keys(categoryMap).sort();

      return categoryMap;
    }

    function renderCategorySections() {
      var sectionsContainer = document.getElementById('categorySections');
      var skeletonLoader = document.getElementById('skeletonLoader');
      var emptyState = document.getElementById('emptyState');

      // Hide skeleton and show content
      if (skeletonLoader) {
        skeletonLoader.classList.add('hidden');
        setTimeout(function() {
          skeletonLoader.style.display = 'none';
        }, 300);
      }

      if (allImages.length === 0) {
        sectionsContainer.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      sectionsContainer.style.display = 'block';
      emptyState.style.display = 'none';
      sectionsContainer.innerHTML = '';

      var categoryMap = extractCategories();

      // Render each category section
      categories.forEach(function(categoryName) {
        var imagesInCategory = categoryMap[categoryName];

        // Create category section
        var section = document.createElement('div');
        section.className = 'category-section';
        section.id = categoryName.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

        // Create category title
        var title = document.createElement('h2');
        title.className = 'category-title';
        title.textContent = categoryName;
        section.appendChild(title);

        // Create image grid for this category
        var grid = document.createElement('div');
        grid.className = 'image-grid';

        imagesInCategory.forEach(function(img, index) {
          var card = document.createElement('div');
          card.className = 'image-card';
          card.draggable = true;
          card.dataset.url = img.url;
          card.dataset.description = img.description;
          card.dataset.category = img.category || 'Uncategorized';

          var uniqueId = 'btn-' + Date.now() + '-' + categoryName + '-' + index;
          var categoryId = 'cat-' + Date.now() + '-' + categoryName + '-' + index;

          // Create drag handle
          var dragHandle = document.createElement('div');
          dragHandle.className = 'drag-handle';
          dragHandle.innerHTML = '<span class="material-icons">drag_indicator</span>';
          dragHandle.title = 'Drag to reorder';

          var isUncategorized = !img.category || img.category === 'Uncategorized';
          var categoryClass = isUncategorized ? 'image-category uncategorized' : 'image-category';
          var categoryText = img.category || 'Uncategorized';
          var categoryIcon = isUncategorized ? 'add' : 'edit';

          // Create image element
          var imgElement = document.createElement('img');
          imgElement.src = img.url;
          imgElement.alt = img.description;
          imgElement.className = 'image-preview';
          imgElement.onerror = function() {
            this.style.display = 'none';
            var placeholder = document.createElement('div');
            placeholder.style.cssText = 'width:100%;height:200px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#999;font-size:0.9em;';
            placeholder.textContent = 'Image Not Found';
            this.parentNode.insertBefore(placeholder, this);
          };

          // Create category element
          var categoryDiv = document.createElement('div');
          categoryDiv.className = categoryClass;
          categoryDiv.id = categoryId;
          categoryDiv.innerHTML = categoryText + '<span class="material-icons category-icon">' + categoryIcon + '</span>';
          categoryDiv.dataset.url = img.url;
          categoryDiv.dataset.category = img.category || '';
          categoryDiv.addEventListener('click', function(e) {
            e.stopPropagation();
            openCategoryEdit(this.id, this.dataset.url, this.dataset.category);
          });

          // Create button row
          var buttonRow = document.createElement('div');
          buttonRow.className = 'button-row';

          // Create copy button
          var copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.id = uniqueId;
          copyBtn.innerHTML = '<span class="material-icons" style="font-size: 16px;">content_copy</span> Copy URL';
          copyBtn.dataset.url = img.url;
          copyBtn.addEventListener('click', function() {
            copyToClipboard(this.dataset.url, this.id);
          });

          // Create open button
          var openBtn = document.createElement('button');
          openBtn.className = 'open-btn';
          openBtn.innerHTML = '<span class="material-icons" style="font-size: 16px;">open_in_new</span> Open';
          openBtn.addEventListener('click', function() {
            window.open(img.url, '_blank');
          });

          buttonRow.appendChild(copyBtn);
          buttonRow.appendChild(openBtn);

          // Build the card
          var infoDiv = document.createElement('div');
          infoDiv.className = 'image-info';

          var descDiv = document.createElement('div');
          descDiv.className = 'image-description';
          descDiv.textContent = img.description;

          var urlDiv = document.createElement('div');
          urlDiv.className = 'image-url';
          urlDiv.textContent = img.url;

          infoDiv.appendChild(categoryDiv);
          infoDiv.appendChild(descDiv);
          infoDiv.appendChild(urlDiv);
          infoDiv.appendChild(buttonRow);

          card.appendChild(dragHandle);
          card.appendChild(imgElement);
          card.appendChild(infoDiv);

          // Add drag event listeners
          setupDragListeners(card);

          grid.appendChild(card);
        });

        section.appendChild(grid);
        sectionsContainer.appendChild(section);
      });
    }

    // Drag and drop functionality
    var draggedCard = null;

    function setupDragListeners(card) {
      card.addEventListener('dragstart', function(e) {
        draggedCard = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/html', this.innerHTML);
      });

      card.addEventListener('dragend', function(e) {
        this.classList.remove('dragging');
        // Remove all drag-over classes
        document.querySelectorAll('.drag-over').forEach(function(el) {
          el.classList.remove('drag-over');
        });
        draggedCard = null;
      });

      card.addEventListener('dragover', function(e) {
        if (e.preventDefault) {
          e.preventDefault();
        }
        e.dataTransfer.dropEffect = 'move';

        if (this === draggedCard) {
          return;
        }

        this.classList.add('drag-over');
        return false;
      });

      card.addEventListener('dragleave', function(e) {
        this.classList.remove('drag-over');
      });

      card.addEventListener('drop', function(e) {
        if (e.stopPropagation) {
          e.stopPropagation();
        }

        if (draggedCard !== this) {
          // Get the category of both cards
          var draggedCategory = draggedCard.dataset.category;
          var targetCategory = this.dataset.category;

          // Only allow reordering within the same category
          if (draggedCategory === targetCategory) {
            // Swap positions in the DOM
            var parent = this.parentNode;
            var draggedIndex = Array.from(parent.children).indexOf(draggedCard);
            var targetIndex = Array.from(parent.children).indexOf(this);

            if (draggedIndex < targetIndex) {
              parent.insertBefore(draggedCard, this.nextSibling);
            } else {
              parent.insertBefore(draggedCard, this);
            }

            // Update the allImages array order
            reorderImagesInArray(draggedCategory);
          } else {
            alert('You can only reorder images within the same category.');
          }
        }

        this.classList.remove('drag-over');
        return false;
      });
    }

    function reorderImagesInArray(category) {
      // Get all cards in this category section
      var categorySection = document.getElementById(category.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, ''));
      if (!categorySection) return;

      var grid = categorySection.querySelector('.image-grid');
      if (!grid) return;

      var cards = Array.from(grid.querySelectorAll('.image-card'));
      var newOrder = cards.map(function(card) {
        return {
          url: card.dataset.url,
          description: card.dataset.description,
          category: card.dataset.category
        };
      });

      // Update allImages array with new order for this category
      var otherImages = allImages.filter(function(img) {
        return (img.category || 'Uncategorized') !== category;
      });

      allImages = otherImages.concat(newOrder);

      // Save the new order to the sheet
      saveImageOrder();
    }

    function saveImageOrder() {
      // Send the new order to the backend
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            console.log('Image order saved successfully');
          } else {
            console.error('Failed to save image order:', result.message);
          }
        })
        .withFailureHandler(function(error) {
          console.error('Error saving image order:', error.message);
        })
        .saveImageOrder(allImages);
    }

    function copyToClipboard(url, btnId) {
      navigator.clipboard.writeText(url).then(function() {
        // Find the button by ID and change its appearance
        var btn = document.getElementById(btnId);
        if (!btn) return;

        var originalHTML = btn.innerHTML;

        btn.classList.add('copied');
        btn.innerHTML = '<span class="material-icons" style="font-size: 16px;">check</span> Copied!';

        setTimeout(function() {
          btn.classList.remove('copied');
          btn.innerHTML = originalHTML;
        }, 2000);
      }).catch(function(err) {
        alert('Failed to copy URL: ' + err);
      });
    }

    // Category editing functionality
    var currentEditingDropdown = null;

    function openCategoryEdit(categoryId, imageUrl, currentCategory) {
      // Close any existing dropdown
      if (currentEditingDropdown) {
        currentEditingDropdown.remove();
      }

      var categoryElement = document.getElementById(categoryId);
      if (!categoryElement) return;

      // Create dropdown
      var dropdown = document.createElement('div');
      dropdown.className = 'category-edit-dropdown show';

      // Add category options
      categories.forEach(function(cat) {
        var option = document.createElement('div');
        option.className = 'category-option';
        if (cat === currentCategory) {
          option.classList.add('selected');
        }
        option.textContent = cat;
        option.addEventListener('click', function() {
          updateImageCategory(imageUrl, cat, categoryId);
        });
        dropdown.appendChild(option);
      });

      // Add divider
      var divider = document.createElement('div');
      divider.className = 'category-divider';
      dropdown.appendChild(divider);

      // Add new category input section
      var newCatSection = document.createElement('div');
      newCatSection.className = 'new-category-inline';

      var newInput = document.createElement('input');
      newInput.type = 'text';
      newInput.id = 'newCatInput-' + categoryId;
      newInput.placeholder = 'New category...';

      var addBtn = document.createElement('button');
      addBtn.textContent = 'Add';
      addBtn.addEventListener('click', function() {
        createAndAssignCategory(imageUrl, categoryId);
      });

      newCatSection.appendChild(newInput);
      newCatSection.appendChild(addBtn);
      dropdown.appendChild(newCatSection);

      categoryElement.appendChild(dropdown);
      currentEditingDropdown = dropdown;

      // Close dropdown when clicking outside
      setTimeout(function() {
        document.addEventListener('click', closeDropdownOnClickOutside);
      }, 10);
    }

    function closeDropdownOnClickOutside(e) {
      if (!currentEditingDropdown) return;

      // Check if click is inside dropdown or on a category element
      var isClickInside = currentEditingDropdown.contains(e.target);
      var isClickOnCategory = e.target.closest('.image-category');

      if (!isClickInside && !isClickOnCategory) {
        currentEditingDropdown.remove();
        currentEditingDropdown = null;
        document.removeEventListener('click', closeDropdownOnClickOutside);
      }
    }

    function updateImageCategory(imageUrl, newCategory, categoryId) {
      // Call server to update category
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            // Update the image in the local array
            var imgIndex = allImages.findIndex(function(img) { return img.url === imageUrl; });
            if (imgIndex !== -1) {
              allImages[imgIndex].category = newCategory;
            }

            // Close dropdown
            if (currentEditingDropdown) {
              currentEditingDropdown.remove();
              currentEditingDropdown = null;
            }

            // Refresh the display
            renderCategorySections();
          } else {
            alert('Failed to update category: ' + result.message);
          }
        })
        .withFailureHandler(function(error) {
          alert('Error updating category: ' + error.message);
        })
        .updateImageCategory(imageUrl, newCategory);
    }

    function createAndAssignCategory(imageUrl, categoryId) {
      var inputId = 'newCatInput-' + categoryId;
      var input = document.getElementById(inputId);
      if (!input) return;

      var newCategory = input.value.trim();
      if (!newCategory) {
        alert('Please enter a category name');
        return;
      }

      // Add to categories array if not exists
      if (!categories.includes(newCategory)) {
        categories.push(newCategory);
        categories.sort();
      }

      // Update the image category
      updateImageCategory(imageUrl, newCategory, categoryId);
    }

    // Initialize on load
    window.addEventListener('load', function() {
      renderCategorySections();

      // Hide loading overlay
      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.classList.add('hidden');
      setTimeout(function() {
        loadingOverlay.style.display = 'none';
      }, 300);
    });
  </script>

  <!-- Add Image Modal -->
